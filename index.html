<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Mainak! 🐶🎂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2b4bff;--pink:#ff4f8b;--sun:#ffd23f;--mint:#3ddc97;--ink:#1b1340;--paper:#fffdf5}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;font-weight:600;color:var(--ink);background:var(--paper);overflow:hidden}
h1,h2,h3{font-family:'Bagel Fat One',Impact,sans-serif;font-weight:400;line-height:1}
button{font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:.9rem 1.6rem;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

/* PAGES: only one is visible at a time */
.page{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:1.25rem;overflow:hidden}
.page.on{display:grid;animation:fadein .6s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.wrap{position:relative;z-index:1;max-width:900px;width:100%}

/* PAGE 1: HERO */
#hero{background:var(--blue);color:#fff}
#hero h1{font-size:clamp(3rem,13vw,9rem);text-shadow:5px 5px 0 var(--ink);letter-spacing:.01em}
#hero h1 .name{display:block;color:var(--sun);font-size:1.25em;transform:rotate(-3deg);margin-top:.1em}
#hero p{font-size:clamp(1.1rem,3vw,1.5rem);margin:1.5rem auto 2rem;max-width:30ch}
.pup{font-size:clamp(5rem,16vw,9rem);display:inline-block;animation:wag 1.4s ease-in-out infinite;transform-origin:50% 90%;user-select:none}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-8px)}}
.blob{position:absolute;border-radius:50%;opacity:.9;z-index:0}

/* PAGE 2: CAKE */
#cake{background:var(--sun)}
#cake h2{font-size:clamp(2rem,7vw,3.5rem);margin-bottom:.5rem}
#cake .sub{margin-bottom:1.5rem;min-height:1.6em}
.cake{width:min(320px,75vw);margin:0 auto 1.5rem;display:block;overflow:visible}
.flame{transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate;transition:opacity .4s,transform .4s}
.flame.out{opacity:0;transform:scale(.2);animation:none}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.9,1.15) rotate(4deg)}}
.notes{position:absolute;inset:0;pointer-events:none;font-size:2rem;overflow:hidden}
.notes i{position:absolute;bottom:-3rem;font-style:normal;animation:rise 6s linear infinite;opacity:.7}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg)}}

/* PAGE 3: FINAL */
#final{background:var(--pink);color:#fff}
#final h2{font-size:clamp(2.4rem,9vw,5rem);text-shadow:4px 4px 0 var(--ink);margin-bottom:1.2rem}
#final h2 span{color:var(--sun)}
.card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:1.4rem 1.6rem;max-width:440px;margin:1.5rem auto 0;transform:rotate(-1.5deg)}
.card .intro{font-size:1.1rem}
.card .me{font-family:'Bagel Fat One';font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.1;margin:.5rem 0}
.card .me small{display:block;color:var(--pink);font-size:.7em;margin-top:.2rem}
.date{display:inline-block;margin-top:.6rem;border:4px solid var(--blue);color:var(--blue);font-family:'Bagel Fat One';padding:.3rem .9rem;border-radius:12px;transform:rotate(-4deg);font-size:1.3rem}
#final .big{font-size:clamp(1.1rem,3vw,1.4rem);max-width:28ch;margin:0 auto}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- PAGE 1 -->
<section class="page on" id="hero">
  <div class="blob" style="width:38vw;height:38vw;background:var(--pink);left:-12vw;top:-8vw"></div>
  <div class="blob" style="width:30vw;height:30vw;background:var(--mint);right:-8vw;bottom:-6vw"></div>
  <div class="wrap">
    <div class="pup" aria-hidden="true">🐶</div>
    <h1>Happy Birthday <span class="name">Mainak!</span></h1>
    <p>Today is all about you, <b>Pupu</b>. There’s a surprise waiting.</p>
    <button id="party">Start the party 🎉</button>
  </div>
</section>

<!-- PAGE 2 -->
<section class="page" id="cake">
  <div class="notes" id="notes" aria-hidden="true"></div>
  <div class="wrap">
    <h2>Make a wish, Pupu</h2>
    <p class="sub" id="cakeMsg">Close your eyes, make a wish, then blow!</p>
    <svg class="cake" viewBox="0 0 320 300" aria-label="Birthday cake with candles">
      <ellipse cx="160" cy="280" rx="150" ry="14" fill="#1b1340" opacity=".2"/>
      <rect x="30" y="190" width="260" height="85" rx="16" fill="#ff4f8b" stroke="#1b1340" stroke-width="5"/>
      <rect x="60" y="120" width="200" height="75" rx="16" fill="#fffdf5" stroke="#1b1340" stroke-width="5"/>
      <path d="M60 140q20 28 40 0t40 0 40 0 40 0 40 0v-8q0-12-12-12H72q-12 0-12 12z" fill="#3ddc97" stroke="#1b1340" stroke-width="5" stroke-linejoin="round"/>
      <g fill="#ffd23f" stroke="#1b1340" stroke-width="3"><circle cx="70" cy="232" r="8"/><circle cx="130" cy="240" r="8"/><circle cx="190" cy="232" r="8"/><circle cx="250" cy="240" r="8"/></g>
      <g stroke="#1b1340" stroke-width="4">
        <rect x="100" y="70" width="14" height="50" fill="#2b4bff"/>
        <rect x="153" y="60" width="14" height="60" fill="#ffd23f"/>
        <rect x="206" y="70" width="14" height="50" fill="#2b4bff"/>
      </g>
      <g id="flames">
        <path class="flame" d="M107 66c-12-14 0-26 0-34 12 8 12 22 0 34z" fill="#ff8a1f" stroke="#1b1340" stroke-width="3"/>
        <path class="flame" d="M160 56c-12-14 0-26 0-34 12 8 12 22 0 34z" fill="#ff8a1f" stroke="#1b1340" stroke-width="3"/>
        <path class="flame" d="M213 66c-12-14 0-26 0-34 12 8 12 22 0 34z" fill="#ff8a1f" stroke="#1b1340" stroke-width="3"/>
      </g>
    </svg>
    <button id="blow">Blow the candles 💨</button>
  </div>
</section>

<!-- PAGE 3 -->
<section class="page" id="final">
  <div class="wrap">
    <h2>Happy Birthday,<br><span>Mainak Paul</span> 🎂</h2>
    <p class="big">Wishing you a year full of happiness, laughs and everything you want.</p>
    <div class="card">
      <p class="intro">And my name is</p>
      <p class="me">Ashutosh Jena <small>(Pupun)</small></p>
      <span class="date">14 November</span>
    </div>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);
const cv = $('#fx'), cx = cv.getContext('2d');
let parts = [], raf = null;
function size(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', size); size();

function confetti(n = 160, x = cv.width/2, y = cv.height/3){
  const colors = ['#2b4bff','#ff4f8b','#ffd23f','#3ddc97','#ffffff'];
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 4 + Math.random()*10;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:6+Math.random()*8,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length],life:140+Math.random()*60});
  }
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p => p.life-- > 0 && p.y < cv.height + 20);
  for(const p of parts){
    p.vy += .3; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : null;
  if(!raf) cx.clearRect(0,0,cv.width,cv.height);
}

function go(id){
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === id));
}

/* floating music notes on page 2 */
$('#notes').innerHTML = Array.from({length:10},(_,i)=>
  `<i style="left:${5+i*10}%;animation-delay:${(i*0.7).toFixed(1)}s">${i%2?'🎵':'🎶'}</i>`).join('');

/* birthday tune: loops until the candles are blown */
let ac = null, loopTimer = null;
const F = {G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
const SONG = [['G4',.5],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
              ['G4',.5],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
              ['G4',.5],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1.5],
              ['F5',.5],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
function playTune(){
  if(!ac) return;
  const beat = .42; let t = ac.currentTime + .05;
  for(const [n,d] of SONG){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = F[n];
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+d*beat);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d*beat+.05); t += d*beat;
  }
  loopTimer = setTimeout(playTune, (t - ac.currentTime + 1) * 1000);
}
function startTune(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC(); if(ac.state === 'suspended') ac.resume();
    playTune();
  }catch(e){}
}
function stopTune(){
  clearTimeout(loopTimer);
  if(ac){ const a = ac; ac = null; setTimeout(()=>a.close().catch(()=>{}), 300); }
}

/* page 1 -> page 2 (the tap lets the browser allow sound) */
$('#party').onclick = () => {
  confetti(220); setTimeout(()=>confetti(120, cv.width*.2, cv.height*.3),250); setTimeout(()=>confetti(120, cv.width*.8, cv.height*.3),450);
  startTune();
  go('cake');
};

/* page 2 -> page 3 */
$('#blow').onclick = () => {
  $('#blow').disabled = true;
  stopTune();
  const fl = document.querySelectorAll('.flame');
  fl.forEach((f,i) => setTimeout(()=>f.classList.add('out'), i*180));
  setTimeout(() => { confetti(260); $('#cakeMsg').textContent = 'Wish locked in! 🥳'; }, 600);
  setTimeout(() => { go('final'); confetti(200); setTimeout(()=>confetti(120, cv.width*.2, cv.height*.4),300); setTimeout(()=>confetti(120, cv.width*.8, cv.height*.4),500); }, 2200);
};
</script>
</body>
</html>
